<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パン手順書作成ツール</title>
<!-- SheetJS -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<!-- SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ==========================================================================
     ■ SECTION 2: HTML STRUCTURE
     ========================================================================== -->

<div class="utility-bar">
  <div class="utility-left">
    <h1>🍞 パン手順書作成ツール</h1>
    <div id="masterStatus">マスタデータを読み込んでいます...</div>
    <div id="dbStatus" style="font-size: 0.75rem; font-weight: bold; padding: 3px 8px; border-radius: 4px; background-color: #e2e8f0; color: #475569; display: inline-block; margin-left: 8px;">✏️ 新規手順書</div>
  </div>
  <div class="utility-right">
    <div class="file-input-wrapper">
      <span style="font-weight: bold; color: #1e293b;">📁 ローカル連携:</span>
      <input type="file" id="masterFileInput" accept=".xlsx, .xls, .csv">
    </div>
    <button type="button" style="background-color: #1976d2;" onclick="loadMasterData()">☁️ スプシから同期</button>
    <button type="button" class="print-btn" onclick="window.print()">PDF保存・印刷</button>
    <button type="button" class="excel-btn" onclick="downloadExcel()">ExcelでDL</button>
    <button type="button" style="background-color: #f59e0b;" onclick="openRecipeListModal()">📂 保存済み一覧 (<span id="savedCount">0</span>)</button>
    <button type="button" style="background-color: #2e7d32;" onclick="saveCurrentRecipeToDB()">💾 保存・更新</button>
    <button type="button" style="background-color: #c62828;" onclick="deleteCurrentRecipeFromDB()">🗑️ 削除</button>
    <button type="button" style="background-color: #455a64;" onclick="exportDBtoJSON()">📤 バックアップ</button>
    <button type="button" style="background-color: #37474f;" onclick="triggerDBRestore()">📥 リストア</button>
    <input type="file" id="dbRestoreInput" accept=".json" style="display: none;" onchange="importDBfromJSON(this)">
  </div>
</div>

<div id="editorWrapper">
  <div id="outputArea">
    
    <!-- ヘッダーエリア -->
    <div class="preview-header">
      <div class="preview-left">
        <div class="preview-title-area">
          <div style="display: flex; gap: 5px; align-items: center; font-size: 10px;">
            <strong>実施期間:</strong>
            <input type="date" id="periodStart" style="width: 105px; font-size: 10px; padding: 1px 2px;"> ～ 
            <input type="date" id="periodEnd" style="width: 105px; font-size: 10px; padding: 1px 2px;">
          </div>
          <div class="product-title-row">
            <span style="white-space: nowrap; font-size: 11px;">商品名称:</span>
            <div class="autocomplete-wrapper" style="flex: 1; min-width: 0;">
              <input type="text" id="productName" autocomplete="off" placeholder="例: ざくざく枝豆チーズスティック" style="font-size: 11px; font-weight: bold; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 2px;">
              <span class="dropdown-arrow">▼</span>
            </div>
            <span style="white-space: nowrap; margin-left: 10px; font-size: 11px;">メニューコード:</span>
            <div class="autocomplete-wrapper" style="width: 70px;">
              <input type="text" id="menuCode" autocomplete="off" placeholder="例: 1001" style="font-size: 11px; font-weight: bold; text-align: center; width: 100%; padding: 1px 2px;">
              <span class="dropdown-arrow">▼</span>
            </div>
          </div>
          <div class="category-title-row edit-only-row" style="display: flex; gap: 10px; align-items: center; font-size: 11px; margin-top: 4px;">
            <strong style="white-space: nowrap; color: #475569;">ブランド区分:</strong>
            <select id="brandCategory" style="padding: 1px; font-size: 11px; width: 150px;">
              <option value="">--選択--</option>
              <option value="BAQET">BAQET</option>
              <option value="BAKERY RESTAURANT C">BAKERY RESTAURANT C</option>
              <option value="BAKERY CAFE C">BAKERY CAFE C</option>
            </select>
            <strong style="white-space: nowrap; margin-left: 10px; color: #475569;">メニュー区分:</strong>
            <select id="menuCategory" style="padding: 1px; font-size: 11px; width: 100px;">
              <option value="">--選択--</option>
              <option value="期間限定">期間限定</option>
              <option value="グランド">グランド</option>
            </select>
          </div>
        </div>
        
        <!-- 使用食材テーブル -->
        <table class="output-table">
          <thead>
            <tr>
              <th style="width: 24%;">コード</th>
              <th style="width: 38%;">品名</th>
              <th style="width: 14%; text-align: center;">使用量</th>
              <th style="width: 10%; text-align: center;">単位</th>
              <th style="width: 14%; text-align: center;">スタンバイ</th>
              <th style="width: 4%; text-align: center;" class="edit-only-col"></th>
            </tr>
          </thead>
          <tbody id="ingredientsContainer">
            <tr class="ing-row">
              <td>
                <input type="text" class="ing-code" placeholder="コード">
                <span class="print-text ing-code-print"></span>
              </td>
              <td>
                <input type="text" class="ing-name" placeholder="品名">
                <span class="print-text ing-name-print"></span>
              </td>
              <td>
                <input type="text" class="ing-amount" placeholder="使用量">
                <span class="print-text ing-amount-print"></span>
              </td>
              <td>
                <select class="ing-unit">
                  <option value="g">g</option>
                  <option value="kg">kg</option>
                  <option value="ml">ml</option>
                  <option value="L">L</option>
                  <option value="個">個</option>
                  <option value="枚">枚</option>
                  <option value="本">本</option>
                  <option value="尾">尾</option>
                  <option value="杯">杯</option>
                  <option value="種">種</option>
                  <option value="人前">人前</option>
                  <option value="円">円</option>
                  <option value="適量">適量</option>
                </select>
              </td>
              <td style="text-align: center; position: relative;">
                <select class="ing-standby">
                  <option value=""></option>
                  <option value="スタンバイ">スタンバイ</option>
                </select>
                <span class="print-standby-check">✔</span>
              </td>
              <td class="edit-only-col" style="text-align: center;">
                <button type="button" class="del-btn edit-only-btn" onclick="removeRow(this, 'ing')">🗑️</button>
              </td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="add-btn edit-only-btn" onclick="addIngredient()">＋ 食材の行を追加</button>
      </div>
      
      <!-- 完成写真 -->
      <div class="preview-right main-image-container">
        <div style="font-weight:bold; font-size:0.8rem; margin-bottom:2px; background:#e8f5e9; width:100%; text-align:center; border: 1px solid #333;">完成写真</div>
        <div class="image-upload-box" onclick="triggerFileInput(this)" style="flex: 1; min-height: 120px;">
          <input type="file" id="mainImage" class="image-file-input" accept="image/*" onchange="previewImage(this)">
          <div class="image-placeholder">
            <span>📷 写真を選択</span>
          </div>
          <div class="image-preview" style="display: none;">
            <img>
            <button type="button" class="del-image-btn edit-only-btn" onclick="clearImage(event, this)">×</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 規格・工程条件 -->
    <div class="specs-container">
      <div class="spec-box">
        <h4>成形：最大のせ数 
          <select id="maxLoad" style="width: auto; padding: 1px; font-size: 11px;">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6" selected>6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
          </select> 個</h4>
        <div class="spec-info">
          <div class="spec-dimension-row">
            寸法: 縦<input type="number" id="moldL" value="0" min="0">×横<input type="number" id="moldW" value="0" min="0">×高さ<input type="number" id="moldH" value="0" min="0">cm
          </div>
        </div>
        <div class="image-upload-box" onclick="triggerFileInput(this)">
          <input type="file" id="moldImg" class="image-file-input" accept="image/*" onchange="previewImage(this)">
          <div class="image-placeholder">
            <span>📷 写真を選択</span>
          </div>
          <div class="image-preview" style="display: none;">
            <img>
            <button type="button" class="del-image-btn edit-only-btn" onclick="clearImage(event, this)">×</button>
          </div>
        </div>
      </div>
      
      <div class="spec-box">
        <h4>ホイロ：
          <select id="proofTime" style="width: auto; padding: 1px; font-size: 11px;">
            <option value="0">0</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="35">35</option>
            <option value="40" selected>40</option>
            <option value="45">45</option>
            <option value="50">50</option>
            <option value="55">55</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="80">80</option>
            <option value="90">90</option>
          </select> 分</h4>
        <div class="spec-info">
          <div class="spec-dimension-row">
            寸法: 縦<input type="number" id="proofL" value="0" min="0">×横<input type="number" id="proofW" value="0" min="0">×高さ<input type="number" id="proofH" value="0" min="0">cm
          </div>
        </div>
        <div class="image-upload-box" onclick="triggerFileInput(this)">
          <input type="file" id="proofImg" class="image-file-input" accept="image/*" onchange="previewImage(this)">
          <div class="image-placeholder">
            <span>📷 写真を選択</span>
          </div>
          <div class="image-preview" style="display: none;">
            <img>
            <button type="button" class="del-image-btn edit-only-btn" onclick="clearImage(event, this)">×</button>
          </div>
        </div>
      </div>
      
      <div class="spec-box">
        <h4>焼成：
          <select id="bakeTime" style="width: auto; padding: 1px; font-size: 11px;">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10" selected>10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="35">35</option>
            <option value="40">40</option>
            <option value="45">45</option>
            <option value="50">50</option>
            <option value="60">60</option>
          </select> 分</h4>
        <div class="spec-info">
          <div class="spec-dimension-row">
            寸法: 縦<input type="number" id="bakeL" value="0" min="0">×横<input type="number" id="bakeW" value="0" min="0">×高さ<input type="number" id="bakeH" value="0" min="0">cm
          </div>
        </div>
        <div class="image-upload-box" onclick="triggerFileInput(this)">
          <input type="file" id="bakeImg" class="image-file-input" accept="image/*" onchange="previewImage(this)">
          <div class="image-placeholder">
            <span>📷 写真を選択</span>
          </div>
          <div class="image-preview" style="display: none;">
            <img>
            <button type="button" class="del-image-btn edit-only-btn" onclick="clearImage(event, this)">×</button>
          </div>
        </div>
      </div>
    </div>



    <!-- 作業手順の2カラム化コンテナ -->
    <div class="steps-grid">
      <div id="outStepsLeft" class="steps-col">
        <!-- Steps 1-4 elements go here -->
      </div>
      <div id="outStepsRight" class="steps-col">
        <!-- Steps 5-8 elements go here -->
      </div>
    </div>
    <div id="outStepsFull" class="steps-full">
      <!-- Steps 9+ elements go here -->
      
      <!-- Initial block on load -->
      <div class="step-block" data-block-type="step">
        <div class="step-block-header edit-only-row">
          <span class="block-title" style="color:#e91e63;">手順①</span>
          <select class="step-template-select edit-only-btn" onchange="applyStepTemplate(this)" style="margin-left: 10px; font-size: 0.8rem; padding: 2px;">
            <option value="">-- 定型文挿入 --</option>
            <option value="proof">ホイロ</option>
            <option value="bake1">焼成①</option>
            <option value="bake2">焼成②（スチーム）</option>
            <option value="bake3">焼成③（2重天板）</option>
            <option value="bake4">焼成④（クッキングシート）</option>
          </select>
          <button type="button" class="del-btn edit-only-btn" style="width:auto; padding:2px 5px;" onclick="removeStepBlock(this)">ブロック削除</button>
        </div>
        <div class="step-preview-block">
          <div class="step-img-out">
            <div class="image-upload-box" onclick="triggerFileInput(this)">
              <input type="file" class="image-file-input block-img" accept="image/*" onchange="previewImage(this)">
              <div class="image-placeholder">
                <span>📷 写真を選択</span>
              </div>
              <div class="image-preview" style="display: none;">
                <img>
                <button type="button" class="del-image-btn edit-only-btn" onclick="clearImage(event, this)">×</button>
              </div>
            </div>
          </div>
          <div class="step-texts-out">
            <div class="print-only-block-title" style="font-weight:bold; margin-bottom:2px; text-align:left;">手順①</div>
            <textarea class="step-textarea" placeholder="手順を自由に入力してください" oninput="autoResizeTextarea(this)"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- 提供方法セクション -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 4px;">
      <div style="width: calc(50% - 4px);">
        <div id="servingMethodSection" class="step-block" style="padding: 2px 4px; margin-bottom: 0;">
          <div style="font-weight:bold; font-size:10px; margin-bottom:2px; display:flex; justify-content:space-between; align-items:center;">
            <span style="color:#e91e63;">■ 提供方法</span>
            <select id="servingTemplate" class="edit-only-btn" style="font-size: 9px; padding: 1px 4px;" onchange="document.getElementById('servingText').value = this.value; autoResizeTextarea(document.getElementById('servingText'));">
              <option value="">-- 提供方法テンプレ --</option>
              <option value="商品の向きをそろえて、焼きたてを提供します。">① 焼きたて</option>
              <option value="チョコが完全に固まってから、商品の向きをそろえて提供します。">② チョコ固め</option>
              <option value="粗熱が取れてから、商品の向きをそろえて提供します。">③ 粗熱取り</option>
              <option value="商品は重ねずに向きをそろえて提供します。">④ 重ねない</option>
            </select>
          </div>
          <textarea id="servingText" class="step-textarea" placeholder="提供方法" rows="1" oninput="autoResizeTextarea(this)" style="min-height: 18px; height: 18px; padding: 2px;"></textarea>
        </div>
      </div>
    </div>

    <div style="margin-top: 10px; display: flex; gap: 10px;" class="edit-only-row">
      <button type="button" class="add-btn" style="background:#e91e63;" onclick="addStepBlock()">＋ 手順ブロックを追加</button>
      <button type="button" class="add-btn" style="background:#2196f3;" onclick="addStandbyBlock()">＋ スタンバイブロックを追加</button>
    </div>

    <!-- スタンバイセクション -->
    <div id="standbySection">
      <div style="font-weight:bold; font-size:0.8rem; margin-bottom:3px; color:#1565c0; border-bottom: 1px solid #1565c0; padding-bottom: 2px;">
        ■ スタンバイ
      </div>
      <div id="standbyContainer">
        <!-- スタンバイブロックがここに追加される -->
      </div>
    </div>

  </div>
</div>

  <script src="js/main.js"></script>
<!-- ==========================================================================
     ■ SECTION 2.1: DIALOGS & MODALS
     ========================================================================== -->
<div id="recipeListModal" class="modal-overlay" style="display: none;" onclick="closeRecipeListModalOnOverlay(event)">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📂 保存済み手順書一覧 (<span id="modalSavedCount">0</span>)</h3>
      <button type="button" class="close-modal-btn" onclick="closeRecipeListModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="search-wrapper" style="margin-bottom: 12px; position: relative;">
        <input type="text" id="modalSearchInput" placeholder="メニューコードまたは商品名で検索..." oninput="filterModalRecipes()" style="width: 100%; padding: 6px 12px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <select id="modalBrandFilter" onchange="filterModalRecipes()" style="padding: 4px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 4px; flex: 1;">
            <option value="">ブランド: すべて</option>
            <option value="BAQET">BAQET</option>
            <option value="BAKERY RESTAURANT C">BAKERY RESTAURANT C</option>
            <option value="BAKERY CAFE C">BAKERY CAFE C</option>
          </select>
          <select id="modalMenuFilter" onchange="filterModalRecipes()" style="padding: 4px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 4px; flex: 1;">
            <option value="">メニュー: すべて</option>
            <option value="期間限定">期間限定</option>
            <option value="グランド">グランド</option>
          </select>
        </div>
      </div>
      <div id="modalRecipeGrid" class="modal-recipe-grid">
        <!-- レシピカードが動的に生成されます -->
      </div>
    </div>
  </div>
</div>

</body>
</html>
