<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パン手順書作成ツール</title>
<!-- SheetJS -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; margin: 0; padding: 0; color: #333; }
  
  /* ユーティリティ操作パネル */
  .utility-bar {
    position: sticky;
    top: 0;
    z-index: 10000;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #cbd5e1;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
  }
  .utility-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .utility-left h1 {
    font-size: 1.05rem;
    margin: 0;
    color: #1e293b;
    border: none;
    padding: 0;
    font-weight: bold;
  }
  .utility-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .file-input-wrapper {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
  }
  .file-input-wrapper input[type="file"] {
    width: auto;
    max-width: 180px;
    padding: 0;
    border: none;
    background: transparent;
  }

  /* エディタ全体の背景 */
  #editorWrapper {
    width: 100%;
    background-color: #f1f5f9;
    padding: 15px;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: calc(100vh - 60px);
  }

  /* ボタン類 */
  button {
    padding: 6px 12px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  button:hover { background-color: #45a049; }
  button.add-btn { background-color: #2196F3; font-size: 0.75rem; padding: 4px 8px; width: auto; margin-top: 5px; }
  button.add-btn:hover { background-color: #1e88e5; }
  button.print-btn { background-color: #607D8B; }
  button.print-btn:hover { background-color: #546e7a; }
  button.excel-btn { background-color: #009688; }
  button.excel-btn:hover { background-color: #00897b; }
  button.del-btn { background-color: #ef4444; padding: 4px 8px; font-size: 0.75rem; font-weight: normal; border-radius: 3px; }
  button.del-btn:hover { background-color: #dc2626; }
  
  /* A4用紙風レイアウト */
  #outputArea { 
    display: block; 
    background: #fff; 
    border: 1px solid #e2e8f0;
    font-size: 11px; 
    width: 210mm;
    min-height: 297mm;
    padding: 5mm 8mm;
    box-sizing: border-box;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
    margin: 0 auto;
    position: relative;
  }
  
  /* ヘッダーレイアウト */
  .preview-header { display: flex; gap: 10px; align-items: stretch; margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 3px; }
  .preview-left { flex: 2; display: flex; flex-direction: column; }
  .preview-right.main-image-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  
  .preview-title-area { margin-bottom: 3px; display: flex; flex-direction: column; gap: 3px; font-size: 10px;}
  
  .product-title-row {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: bold;
    width: 100%;
  }
  .product-title-row input {
    font-size: 11px !important;
  }
  
  /* 規格と工程条件 */
  .specs-container { display: flex; gap: 4px; margin-bottom: 4px; }
  .spec-box { flex: 1; border: 1px solid #333; padding: 2px; font-size: 10px; display: flex; flex-direction: column; background: #fff; }
  .spec-box h4 { margin: 0 0 2px 0; background: #e8f5e9; padding: 1px 1px; text-align: center; font-size: 11px; font-weight: bold; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: center; gap: 2px; }
  .spec-box h4 input, .spec-box h4 select { font-size: 11px !important; font-weight: bold !important; text-align: center; border: 1px dashed transparent; background: transparent; cursor: pointer; }
  .spec-box h4 input { width: 35px; }
  .spec-box h4 input:hover, .spec-box h4 select:hover { border-color: #94a3b8; background-color: #f8fafc; }
  .spec-box h4 input:focus, .spec-box h4 select:focus { border-color: #2196F3; background-color: #fff; outline: none; }
  .spec-info { margin-bottom: 2px; font-size: 9px; }
  .spec-dimension-row { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; margin-bottom: 1px; }
  .spec-dimension-row input {
    width: 32px; /* 幅を25pxから32pxに少し広げて数値が見えやすく調整 */
    font-size: 9px;
    text-align: center;
  }
  
  /* 寸法等の数値スピンボタンを非表示化 */
  .spec-dimension-row input[type="number"]::-webkit-outer-spin-button,
  .spec-dimension-row input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .spec-dimension-row input[type="number"] {
    -moz-appearance: textfield;
  }
  
  /* テーブル */
  .output-table { width: 100%; border-collapse: collapse; margin-bottom: 3px; font-size: 10px; }
  .output-table th, .output-table td {
    border: 1px solid #ccc;
    padding: 1px 3px;
    text-align: left;
    font-size: 10px;
    vertical-align: middle;
  }
  .output-table th { background-color: #f2f2f2; font-weight: bold; }
  .output-table input[type="text"],
  .output-table input[type="number"],
  .output-table select {
    width: 100% !important;
    box-sizing: border-box;
    text-align: inherit;
  }
  
  /* 生地出庫 */
  #dispatchSection {
    margin-bottom: 3px;
    padding: 2px;
    border: 1px solid #b0bec5;
    border-radius: 4px;
    background-color: #fafafa;
    font-size: 10px;
  }
  #dispatchSection input, #dispatchSection select {
    font-size: 10px !important;
  }
  #dispatchSection .step-num-label {
    font-size: 10px !important;
  }
  #dispatchSection strong {
    font-size: 10px !important;
  }
  #dispatchSection button {
    font-size: 9px !important;
    padding: 2px 4px !important;
  }
  
  /* 手順リストとグリッド */
  .steps-grid { display: flex; gap: 8px; margin-bottom: 4px; }
  .steps-col { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .steps-full { display: flex; flex-direction: column; gap: 4px; }
  
  .step-block { border: 1px dashed #cbd5e1; padding: 4px; background: #fff; margin-bottom: 3px; border-radius: 4px; }
  .step-block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; font-size: 11px; background: #f8fafc; padding: 1px 3px; border-radius: 3px; }
  .step-preview-block { display: flex; gap: 6px; font-size: 10px; align-items: flex-start; }
  .step-img-out { flex: 0 0 120px; text-align: center; display: flex; flex-direction: column; }
  .step-texts-out { flex: 1; display: flex; flex-direction: column; }
  
  /* 手順テキストボックス */
  .step-textarea {
    width: 100%;
    min-height: 60px;
    border: 1px dashed transparent;
    background: transparent;
    font-family: inherit;
    font-size: 10px;
    line-height: 1.3;
    padding: 2px;
    box-sizing: border-box;
    resize: none;
    overflow-y: hidden;
    transition: all 0.15s ease;
  }
  .step-textarea:hover {
    border-color: #cbd5e1;
    background-color: #f8fafc;
  }
  .step-textarea:focus {
    border-color: #2196F3;
    background-color: #fff;
    outline: none;
    box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.15);
  }

  .step-input-row { display: flex; gap: 4px; align-items: center; margin-bottom: 2px; background: #f8fafc; padding: 2px; border: 1px solid #e2e8f0; border-radius: 3px; }
  .step-num-label { font-weight: bold; width: 15px; text-align: center; font-size: 10px; }
  
  /* スタンバイ */
  #standbySection { margin-top: 6px; border-top: 1px solid #ccc; padding-top: 4px; }
  
  /* 画像アップローダーのスタイリング */
  .image-upload-box {
    position: relative;
    border: 1px dashed #cbd5e1;
    background-color: #f8fafc;
    border-radius: 4px;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    width: 100%;
    box-sizing: border-box;
  }
  .image-upload-box:hover {
    border-color: #2196F3;
    background-color: #eff6ff;
  }
  .image-placeholder {
    color: #64748b;
    font-size: 0.7rem;
    font-weight: bold;
    text-align: center;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .image-preview {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .image-preview img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .del-image-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    background-color: rgba(239, 68, 68, 0.9);
    color: white;
    border: none;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 0.7rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
    z-index: 10;
  }
  .del-image-btn:hover { background-color: #dc2626; }
  
  .spec-box .image-upload-box { height: 110px; margin-top: auto; }
  .main-image-container .image-upload-box { height: 140px; margin-top: 5px; }
  .step-img-out .image-upload-box { height: 100px; }
  .image-file-input { display: none; }

  /* WYSIWYG直接編集用インプットのブレンドスタイル */
  #outputArea input, #outputArea select {
    border: 1px dashed transparent;
    background: transparent;
    padding: 2px 4px;
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    box-sizing: border-box;
    transition: all 0.15s ease;
  }
  #outputArea input[type="checkbox"] {
    width: auto;
    border: none;
  }
  #outputArea input:hover, #outputArea select:hover {
    border-color: #94a3b8;
    background-color: #f8fafc;
  }
  #outputArea input:focus, #outputArea select:focus {
    border-color: #2196F3;
    background-color: #fff;
    outline: none;
    box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.15);
  }
  
  /* オートコンプリート */
  .autocomplete-wrapper {
    position: relative;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
  }
  .autocomplete-wrapper input {
    padding-right: 16px !important;
  }
  .autocomplete-wrapper .dropdown-arrow {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.5rem;
    color: #64748b;
    pointer-events: auto; /* クリックイベントを受け取るように変更 */
    cursor: pointer; /* マウスホバーでポインターを表示 */
    user-select: none;
  }
  .suggest-list {
    position: absolute;
    background: #fff;
    border: 1px solid #cbd5e1;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    z-index: 9999;
    max-height: 200px;
    overflow-y: auto;
    border-radius: 4px;
    font-size: 0.75rem;
    width: 100%;
    min-width: 260px; /* メニューコードなどの狭い入力欄でも商品名が見えるよう最低幅を確保 */
    box-sizing: border-box;
    left: 0;
    top: 100%;
    margin-top: 2px;
  }
  .suggest-item {
    padding: 6px 8px;
    cursor: pointer;
    border-bottom: 1px solid #f1f5f9;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .suggest-item:hover { background: #eff6ff; color: #1d4ed8; }
  .suggest-item:last-child { border-bottom: none; }

  /* 印刷非表示クラス */
  .print-hide { display: none !important; }
  .print-only-block-title { display: none; }
  .print-standby-check { display: none; }

  /* スマホ向けレスポンシブ表示（編集画面時） */
  @media (max-width: 600px) {
    .utility-bar { padding: 8px; justify-content: center; flex-direction: column; gap: 8px; }
    .utility-right { justify-content: center; }
    #editorWrapper { padding: 5px; }
    #outputArea { width: 100%; min-height: auto; padding: 8px; box-shadow: none; border: none; }
    
    .preview-header { flex-direction: column; align-items: stretch; gap: 10px; }
    .preview-left { width: 100%; }
    .preview-right { width: 100%; }
    .specs-container { flex-direction: column; gap: 8px; }
    .steps-grid { flex-direction: column; gap: 10px; }
    .step-preview-block { flex-direction: column; align-items: stretch; gap: 8px; }
    .step-img-out { width: 100%; flex: auto; }
    
    .output-table th, .output-table td { padding: 4px; }
    .output-table th:nth-child(6), .output-table td:nth-child(6) { width: 30px; } /* del-btn col */
  }

  /* 印刷用スタイル設定 */
  @media print {
    body { background: #fff; margin: 0; padding: 0; font-family: "Meiryo", sans-serif; }
    .utility-bar, .edit-only-btn, .edit-only-col, .dropdown-arrow, .image-placeholder, .del-image-btn, .step-block-header {
      display: none !important;
    }
    #editorWrapper { background: none; padding: 0; margin: 0; display: block; }
    #outputArea { 
      display: block !important; 
      border: none !important; 
      padding: 0 !important; 
      margin: 0 !important; 
      width: 100% !important; 
      box-sizing: border-box !important; 
      box-shadow: none !important; 
      transform: none !important; 
      min-height: auto !important; 
    }
    @page { margin: 8mm 10mm; size: A4 portrait; }
    
    #outputArea { font-size: 7.5pt; }
    #outputArea input, #outputArea select {
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 !important;
      outline: none !important;
      pointer-events: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }
    
    /* 日付ピッカーの矢印やカレンダーマークを非表示 */
    input[type="date"]::-webkit-calendar-picker-indicator {
      display: none !important;
      -webkit-appearance: none;
    }

    /* 空の入力行を印刷時に隠す */
    .ing-row:has(.ing-code:placeholder-shown):has(.ing-name:placeholder-shown):has(.ing-amount:placeholder-shown) {
      display: none !important;
    }
    
    /* スタンバイ選択時の印刷スタイル */
    .ing-standby { display: none !important; }
    .ing-row.is-standby .print-standby-check {
      display: block !important;
      color: #1565c0;
      font-weight: bold;
      text-align: center;
    }
    .ing-row.is-standby {
      background-color: #e3f2fd !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* 印刷時のタイトルを出す */
    .print-only-block-title {
      display: block !important;
    }

    .preview-header { margin-bottom: 3px; padding-bottom: 3px; }
    .main-image-container .image-upload-box { height: 120px; border: none !important; }
    .spec-box .image-upload-box { height: 85px; border: none !important; }
    .step-img-out .image-upload-box { height: 85px; border: none !important; }
    
    /* 画像がない枠自体を非表示 */
    .image-upload-box:not(:has(img)) {
      display: none !important;
    }

    /* 手順テキストボックスの印刷時スタイル */
    .step-textarea {
      border: none !important;
      background: transparent !important;
      padding: 0 !important;
      outline: none !important;
      box-shadow: none !important;
      overflow: hidden !important;
      resize: none !important;
    }
    
    /* 空の手順ブロックを非表示 */
    .step-block:has(.step-textarea:placeholder-shown):not(:has(img)) {
      display: none !important;
    }

    .specs-container { gap: 4px; margin-bottom: 4px; }
    .step-preview-block { margin-bottom: 2px; padding-bottom: 2px; }
    .step-img-out { flex: 0 0 120px; }
    
    /* 空のセクションを印刷時に隠す */
    .print-empty-hide {
      display: none !important;
    }
  }
</style>
</head>
<body>

<div class="utility-bar">
  <div class="utility-left">
    <h1>🍞 パン手順書作成ツール</h1>
    <div id="masterStatus">マスタデータを読み込んでいます...</div>
  </div>
  <div class="utility-right">
    <div class="file-input-wrapper">
      <span style="font-weight: bold; color: #1e293b;">📁 ローカル連携:</span>
      <input type="file" id="masterFileInput" accept=".xlsx, .xls, .csv">
    </div>
    <button type="button" style="background-color: #1976d2;" onclick="loadMasterData()">☁️ スプシから同期</button>
    <button type="button" class="print-btn" onclick="window.print()">PDF保存・印刷</button>
    <button type="button" class="excel-btn" onclick="downloadExcel()">ExcelでDL</button>
  </div>
</div>

<div id="editorWrapper">
  <div id="outputArea">
    
    <!-- ヘッダーエリア -->
    <div class="preview-header">
      <div class="preview-left">
        <div class="preview-title-area">
          <div style="display: flex; gap: 5px; align-items: center; font-size: 10px;">
            <strong>実施期間:</strong>
            <input type="date" id="periodStart" style="width: 105px; font-size: 10px; padding: 1px 2px;"> ～ 
            <input type="date" id="periodEnd" style="width: 105px; font-size: 10px; padding: 1px 2px;">
          </div>
          <div class="product-title-row">
            <span style="white-space: nowrap; font-size: 11px;">商品名称:</span>
            <div class="autocomplete-wrapper" style="flex: 1; min-width: 0;">
              <input type="text" id="productName" autocomplete="off" placeholder="例: ざくざく枝豆チーズスティック" style="font-size: 11px; font-weight: bold; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 2px;">
              <span class="dropdown-arrow">▼</span>
            </div>
            <span style="white-space: nowrap; margin-left: 10px; font-size: 11px;">メニューコード:</span>
            <div class="autocomplete-wrapper" style="width: 70px;">
              <input type="text" id="menuCode" autocomplete="off" placeholder="例: 1001" style="font-size: 11px; font-weight: bold; text-align: center; width: 100%; padding: 1px 2px;">
              <span class="dropdown-arrow">▼</span>
            </div>
          </div>
        </div>
        
        <!-- 使用食材テーブル -->
        <table class="output-table">
          <thead>
            <tr>
              <th style="width: 12%;">コード</th>
              <th style="width: 60%;">品名</th>
              <th style="width: 8%; text-align: center;">使用量</th>
              <th style="width: 8%; text-align: center;">単位</th>
              <th style="width: 8%; text-align: center;">スタ</th>
              <th style="width: 4%; text-align: center;" class="edit-only-col"></th>
            </tr>
          </thead>
          <tbody id="ingredientsContainer">
            <tr class="ing-row">
              <td><input type="text" class="ing-code" placeholder="コード"></td>
              <td><input type="text" class="ing-name" placeholder="品名"></td>
              <td><input type="number" class="ing-amount" step="any" placeholder="使用量"></td>
              <td>
                <select class="ing-unit">
                  <option value="g">g</option>
                  <option value="kg">kg</option>
                  <option value="ml">ml</option>
                  <option value="L">L</option>
                  <option value="個">個</option>
                  <option value="枚">枚</option>
                  <option value="本">本</option>
                  <option value="尾">尾</option>
                  <option value="杯">杯</option>
                  <option value="種">種</option>
                  <option value="人前">人前</option>
                  <option value="円">円</option>
                  <option value="適量">適量</option>
                </select>
              </td>
              <td style="text-align: center; position: relative;">
                <select class="ing-standby">
                  <option value=""></option>
                  <option value="スタンバイ">スタンバイ</option>
                </select>
                <span class="print-standby-check">✔</span>
              </td>
              <td class="edit-only-col" style="text-align: center;">
                <button type="button" class="del-btn edit-only-btn" onclick="removeRow(this, 'ing')">🗑️</button>
              </td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="add-btn edit-only-btn" onclick="addIngredient()">＋ 食材の行を追加</button>
      </div>
      
      <!-- 完成写真 -->
      <div class="preview-right main-image-container">
        <div style="font-weight:bold; font-size:0.8rem; margin-bottom:2px; background:#e8f5e9; width:100%; text-align:center; border: 1px solid #333;">完成写真</div>
        <div class="image-upload-box" onclick="triggerFileInput(this)" style="flex: 1; min-height: 120px;">
          <input type="file" id="mainImage" class="image-file-input" accept="image/*" onchange="previewImage(this)">
          <div class="image-placeholder">
            <span>📷 写真を選択</span>
          </div>
          <div class="image-preview" style="display: none;">
            <img>

<script>
  const circleNums = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];

  // 安全なlocalStorageアクセスラッパー (SecurityError等によるJSクラッシュの防止)
  const safeStorage = {
    getItem(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    },
    setItem(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    },
    removeItem(key) {
      try { localStorage.removeItem(key); } catch (e) {}
    }
  };

  // テキストエリアの高さ自動調整
  function autoResizeTextarea(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
  }

  // 生地の連番などの更新
  function updateNumbers(containerId, rowClass) {
    const container = document.getElementById(containerId);
    const rows = container.querySelectorAll('.' + rowClass);
    rows.forEach((row, index) => {
      const numLabel = row.querySelector('.step-num-label');
      if(numLabel) {
        numLabel.innerText = index < circleNums.length ? circleNums[index] : `(${index + 1})`;
      }
    });
  }

  // 手順ブロックの連番更新と自動レイアウト振り分け
  function reorganizeStepBlocks() {
    const blocks = Array.from(document.querySelectorAll('#outputArea .step-block[data-block-type="step"]'));
    const outLeft = document.getElementById('outStepsLeft');
    const outRight = document.getElementById('outStepsRight');
    const outFull = document.getElementById('outStepsFull');

    outLeft.innerHTML = '';
    outRight.innerHTML = '';
    outFull.innerHTML = '';

    blocks.forEach((block, index) => {
      if (index < 4) {
        outLeft.appendChild(block);
      } else if (index < 8) {
        outRight.appendChild(block);
      } else {
        outFull.appendChild(block);
      }
    });

    updateBlockNumbers();
    adjustPreviewScale();
  }

  // 手順ブロックヘッダー「手順①」の連番更新
  function updateBlockNumbers() {
    const blocks = document.querySelectorAll('#outputArea .step-block[data-block-type="step"]');
    blocks.forEach((block, index) => {
      const titleSpan = block.querySelector('.block-title');
      const printTitle = block.querySelector('.print-only-block-title');
      const numStr = index < circleNums.length ? circleNums[index] : `(${index + 1})`;
      if(titleSpan) titleSpan.innerText = `手順${numStr}`;
      if(printTitle) printTitle.innerText = `手順${numStr}`;
    });
  }

  // スタンバイブロックのヘッダー「スタンバイ」の更新
  function updateStandbyBlockNumbers() {
    const blocks = document.getElementById('standbyContainer').querySelectorAll('.standby-block');
    blocks.forEach((block) => {
      const titleSpan = block.querySelector('.s-block-title');
      if(titleSpan) titleSpan.innerText = `スタンバイ`;

    const row = btn.closest('.row, .step-input-row, .ing-row');

    if (type === 'dispatch') {
      updateNumbers('dispatchStepsContainer', 'dispatch-step-row');
      updateDispatchVisibility();

  function removeStepBlock(btn) {

    reorganizeStepBlocks();

  // 画像アップローダーの動作処理
  function triggerFileInput(box) {
    const fileInput = box.querySelector('input[type="file"]');
    if (fileInput) fileInput.click();
  }

  // 画像プレビュー処理
  function previewImage(input) {
    const box = input.closest('.image-upload-box');
    const placeholder = box.querySelector('.image-placeholder');
    const preview = box.querySelector('.image-preview');
    const img = preview.querySelector('img');
    
    if (input.files && input.files[0]) {
      const url = URL.createObjectURL(input.files[0]);
      img.src = url;
      placeholder.style.display = 'none';
      preview.style.display = 'flex';
      updateStandbyVisibility();
    }
  }

  // 画像クリア処理
  function clearImage(event, btn) {
    event.stopPropagation();
    const box = btn.closest('.image-upload-box');
    const fileInput = box.querySelector('input[type="file"]');
    const placeholder = box.querySelector('.image-placeholder');
    const preview = box.querySelector('.image-preview');
    const img = preview.querySelector('img');
    
    fileInput.value = '';
    img.src = '';
    placeholder.style.display = 'flex';
    preview.style.display = 'none';
    updateStandbyVisibility();
  }

  // プレビューの縮小率の調整
  function adjustPreviewScale() {
    const wrapper = document.getElementById('editorWrapper');
    const outputArea = document.getElementById('outputArea');
    if (!wrapper || !outputArea) return;

    if (window.innerWidth <= 600) {
      outputArea.style.transform = 'none';
      wrapper.style.height = 'auto';
      return;
    }
    
    const wrapperWidth = wrapper.clientWidth;
    const pageTargetWidth = 840;
    const scale = Math.min(1, (wrapperWidth - 20) / pageTargetWidth);
    
    outputArea.style.transform = `scale(${scale})`;
    outputArea.style.transformOrigin = 'top center';
    
    if (scale < 1) {
      const rect = outputArea.getBoundingClientRect();
      wrapper.style.height = (rect.height + 20) + 'px';
    } else {
      wrapper.style.height = 'auto';
    }
  }

  window.addEventListener('resize', adjustPreviewScale);

  // Excelダウンロード処理
  function downloadExcel() {
    const data = [];
    
    // 基本情報
    const pStart = document.getElementById('periodStart').value;
    const pEnd = document.getElementById('periodEnd').value;
    data.push(["実施期間", `${pStart} ～ ${pEnd}`, "商品名称", document.getElementById('productName').value]);
    data.push([]);
    
    // 食材
    data.push(["コード", "品名", "使用量", "スタンバイ"]);
    document.querySelectorAll('#ingredientsContainer .ing-row').forEach(row => {
      const code = row.querySelector('.ing-code').value;
      const name = row.querySelector('.ing-name').value;
      const amount = row.querySelector('.ing-amount').value;
      const unit = row.querySelector('.ing-unit').value;
      const standby = row.querySelector('.ing-standby').value === 'スタンバイ';
      if(code || name || amount) {
        data.push([code, name, `${amount}${unit}`, standby ? "〇" : ""]);
      }
    });

  function processMasterRows(rows, sourceLabel) {
    const statusDiv = document.getElementById('masterStatus');
    menuMaster = {};
    
    let headerIdx = -1;
    for (let i = 0; i < rows.length; i++) {
      if (rows[i] && (rows[i].includes('業務形態区分') || rows[i].includes('業態区分'))) {
        headerIdx = i;
        break;
      }
    }
    
    if (headerIdx === -1) {
      headerIdx = 0;
    }
    
    for (let i = headerIdx + 1; i < rows.length; i++) {
      const cols = rows[i];
      if (!cols || cols.length === 0) continue;
      
      let menuCode = cols[3] ? String(cols[3]).trim() : "";
      let menuName = cols[4] ? String(cols[4]).trim() : "";
      const ingCode = cols[10] ? String(cols[10]).trim() : "";
      const ingName = cols[11] ? String(cols[11]).trim() : "";
      const ingAmount = cols[12] ? String(cols[12]).trim() : "";
      const ingUnit = cols[13] ? String(cols[13]).trim() : "";
      
      if (!menuCode || menuCode === "ﾒﾆｭｰｺｰﾄﾞ" || menuCode === "メニューコード") continue;
      
      if (!menuMaster[menuCode]) {
        menuMaster[menuCode] = {
          name: menuName,
          ingredients: []
        };
      }
      
      if (ingCode || ingName) {
        // ヘッダー文字列の混入を防ぐ
        if (ingCode !== "商品コード" && ingName !== "商品名称") {
          menuMaster[menuCode].ingredients.push({
            code: ingCode || "",
            name: ingName || "",
            amount: ingAmount || "",
            unit: ingUnit || "g"
          });
        }
      }
    }
    
    const menuCount = Object.keys(menuMaster).length;
    statusDiv.innerText = `マスタデータ読込完了 (${menuCount}件のメニュー) (${sourceLabel})`;
    statusDiv.style.backgroundColor = "#e8f5e9";
    statusDiv.style.color = "#2e7d32";
    
    safeStorage.setItem('cachedMenuMaster', JSON.stringify(menuMaster));
    safeStorage.setItem('cachedMenuCount', menuCount);
    safeStorage.setItem('cachedSourceLabel', sourceLabel);
    safeStorage.setItem('cachedVersion', "v4");

  async function loadMasterData() {
    const statusDiv = document.getElementById('masterStatus');
    statusDiv.innerText = "マスタデータをスプレッドシートから読み込んでいます...";
    statusDiv.style.backgroundColor = "#ffe0b2";
    statusDiv.style.color = "#e65100";

    const url = "https://docs.google.com/spreadsheets/d/1FUpFIMRcoOf-f5xDkcJGNparud13cgINV7JQehHznZ8/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent("BQ原価レシピ7");
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error("ネットワークエラーが発生しました。");
      const arrayBuffer = await response.arrayBuffer();
      const decoder = new TextDecoder('utf-8');
      const csvText = decoder.decode(arrayBuffer);
      
      const lines = csvText.split(/\r?\n/);
      const rows = [];
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].trim()) {
          rows.push(parseCSVLine(lines[i]));
        }
      }
      
      processMasterRows(rows, "スプシから同期");
      
    } catch (error) {
      console.error(error);
      statusDiv.innerText = "同期失敗：上の『ローカル連携』からダウンロードしたExcel/CSVファイルを読み込めます。";
      statusDiv.style.backgroundColor = "#ffebee";
      statusDiv.style.color = "#c62828";
    }
  }

  function parseCSVLine(text) {
    const result = [];
    let cur = '';
    let inQuote = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '"') {
        inQuote = !inQuote;
      } else if (c === ',' && !inQuote) {
        result.push(cur.trim());
        cur = '';
      } else {
        cur += c;
      }
    }
    result.push(cur.trim());
    return result;
  }

  function closeAllSuggestions() {
    document.querySelectorAll('.suggest-list').forEach(el => el.remove());

  function showSuggestions(inputEl) {
    const val = inputEl.value.trim();
    if (activeSuggestTarget === inputEl && activeSuggestValue === val) {
      if (inputEl.parentElement.querySelector('.suggest-list')) {
        return;
      }
    }

    closeAllSuggestions();
    activeSuggestTarget = inputEl;
    activeSuggestValue = val;

    const wrapper = inputEl.parentElement;
    if (!wrapper.classList.contains('autocomplete-wrapper')) return;

    let matches = [];
    const valUpper = val.toUpperCase();

    for (const [code, menu] of Object.entries(menuMaster)) {
      const matchCode = code.toUpperCase().includes(valUpper);
      const matchName = menu.name.toUpperCase().includes(valUpper);
      if (!val || matchCode || matchName) {
        matches.push({
          code: code,
          name: menu.name
        });
      }
    }

    if (matches.length === 0) return;

    matches = matches.slice(0, 50);

    const listDiv = document.createElement('div');
    listDiv.className = 'suggest-list';
    if (inputEl.id === 'menuCode') {
      listDiv.style.right = '0';
      listDiv.style.left = 'auto';
    }

    matches.forEach(item => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'suggest-item';
      itemDiv.innerText = `${item.code} : ${item.name}`;
      
      itemDiv.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        
        document.getElementById('menuCode').value = item.code;
        document.getElementById('productName').value = item.name;
        populateIngredients(menuMaster[item.code].ingredients);
        closeAllSuggestions();
      });
      listDiv.appendChild(itemDiv);
    });

    wrapper.appendChild(listDiv);
  }

  function handleInputEvent(e) {
    let target = e.target;
    if (!target) return;
    
    // classListの存在確認を含め安全に取得

    if (isArrowClick) {
      target = target.parentElement ? target.parentElement.querySelector('input') : null;
    }
    if (!target) return;

    if (target.id === 'menuCode' || target.id === 'productName') {
      if (e.type === 'click' && isArrowClick) {
        const existingList = target.parentElement ? target.parentElement.querySelector('.suggest-list') : null;
        if (existingList) {
          closeAllSuggestions();
          return;
        }
        target.focus();
      }
      showSuggestions(target);
    }
  }

      statusDiv.style.color = "#e65100";

      const fileName = file.name;
      const isExcel = fileName.endsWith('.xlsx') || fileName.endsWith('.xls');

      const reader = new FileReader();
      if (isExcel) {
        reader.onload = function(evt) {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});
            processMasterRows(rows, `Excel: ${fileName}`);
          } catch (err) {
            console.error(err);
            statusDiv.innerText = "Excelファイルの解析に失敗しました。";
            statusDiv.style.backgroundColor = "#ffebee";
            statusDiv.style.color = "#c62828";
          }
        };
        reader.readAsArrayBuffer(file);
      } else {
        reader.onload = function(evt) {
          try {
            const text = evt.target.result;
            const lines = text.split(/\r?\n/);
            const rows = [];
            for (let i = 0; i < lines.length; i++) {
              if (lines[i].trim()) {
                rows.push(parseCSVLine(lines[i]));
              }
            }
            processMasterRows(rows, `CSV: ${fileName}`);
          } catch (err) {
            console.error(err);
            statusDiv.innerText = "CSVファイルの解析に失敗しました。";
            statusDiv.style.backgroundColor = "#ffebee";
            statusDiv.style.color = "#c62828";
          }
        };
        reader.readAsText(file, 'utf-8');
      }
    });
  }
</script>
</body>
